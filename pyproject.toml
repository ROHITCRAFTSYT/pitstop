[project]
name = "pitstop"
version = "0.1.0"
description = "An autonomous pit crew for AI agents: reads neatlogs traces, finds root causes, patches, and proves the fix with before/after evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "neatlogs>=1.4",
  "openai>=1.40",
  "rich>=13",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pytest>=8",
]

[project.scripts]
pitstop = "pitstop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitstop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
